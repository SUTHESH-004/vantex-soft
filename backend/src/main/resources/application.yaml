spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vantex}
    username: ${DB_USERNAME:vantex}
    password: ${DB_PASSWORD:vantex}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    time-zone: UTC
