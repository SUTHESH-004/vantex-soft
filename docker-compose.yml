services:
  db:
    image: postgres:16
    container_name: vantex-db
    environment:
      POSTGRES_DB: vantex
      POSTGRES_USER: vantex
      POSTGRES_PASSWORD: vantex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vantex"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
