name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA of the backend image to redeploy (rollback). Roll back web with Vercel Instant Rollback.
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
  IMAGE: ghcr.io/suthesh-004/vantex-backend

jobs:
  backend:
    name: Deploy backend
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - name: Log in to GHCR
        if: github.event_name == 'workflow_run'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4
        if: github.event_name == 'workflow_run'

      - name: Build and push image
        if: github.event_name == 'workflow_run'
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: ${{ env.IMAGE }}:${{ env.SHA }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render deploy
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          IMG_URL=$(jq -rn --arg v "$IMAGE:$SHA" '$v|@uri')
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL&imgURL=$IMG_URL"
          echo "Render deploy triggered for $IMAGE:$SHA"

      - name: Skip Render (not configured yet)
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: echo "::notice::RENDER_DEPLOY_HOOK_URL secret not set; image pushed, Render not triggered."
  web:
    name: Deploy web
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Vercel deploy
        if: env.VERCEL_DEPLOY_HOOK_URL != ''
        run: |
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
          echo "Vercel deploy triggered for main"

      - name: Skip Vercel (not configured yet)
        if: env.VERCEL_DEPLOY_HOOK_URL == ''
        run: echo "::notice::VERCEL_DEPLOY_HOOK_URL secret not set; web not deployed."
